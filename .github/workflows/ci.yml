name: ci

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Job-level `if` must not use `hashFiles()` or `secrets.*` (GitHub rejects them). Use step outputs to gate on secrets; keep path guards at step level if needed.

jobs:
  infra-validate:
    name: Validate infra and root orchestration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate docker compose
        run: npm run compose:config

      # Runner has Docker + Node; install Azure CLI only (no pwsh — matches validate-bicep.ps1 targets).
      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Validate Bicep templates
        run: |
          set -e
          az bicep version >/dev/null 2>&1 || az bicep install
          az bicep build --file infra/bicep/modules/monitoring.bicep
          az bicep build --file infra/bicep/main.bicep

      - name: Validate hackathon parameters JSON
        run: node -e "JSON.parse(require('fs').readFileSync('infra/environments/hackathon/parameters.dev.json','utf8'))"

  frontend:
    name: Frontend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-spa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend-spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Run frontend tests
        run: npm test --if-present

      - name: Build frontend
        run: npm run build --if-present

  backend:
    name: Backend restore, build, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore apps/services/TradingPlatform.sln

      - name: Build solution
        run: dotnet build apps/services/TradingPlatform.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test apps/services/TradingPlatform.sln --configuration Release --no-build

  build-images:
    name: Build and push container images
    runs-on: ubuntu-latest
    needs:
      - infra-validate
      - frontend
      - backend
    # secrets.* is not allowed in job-level `if` (use a step to read secrets; see first step below).
    if: ${{ github.event_name != 'pull_request' && vars.ACR_NAME != '' && vars.ACR_LOGIN_SERVER != '' }}
    strategy:
      fail-fast: false
      matrix:
        # Context must be repo root: Dockerfiles use paths like apps/frontend-spa/... and apps/services/.../src/...
        include:
          - name: frontend-spa
            dockerfile: apps/frontend-spa/Dockerfile
            context: .
            repository: frontend-spa
          - name: market-service
            dockerfile: apps/services/market-service/Dockerfile
            context: .
            repository: market-service
          - name: trade-service
            dockerfile: apps/services/trade-service/Dockerfile
            context: .
            repository: trade-service
          - name: settlement-service
            dockerfile: apps/services/settlement-service/Dockerfile
            context: .
            repository: settlement-service
    steps:
      - name: Check Azure OIDC secrets
        id: azure_creds
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] && [ -n "${{ secrets.AZURE_TENANT_ID }}" ] && [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping container image build: Azure OIDC secrets (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID) are not all set."
          fi

      - name: Checkout
        if: steps.azure_creds.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Azure login
        if: steps.azure_creds.outputs.ok == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: steps.azure_creds.outputs.ok == 'true'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push ${{ matrix.name }} image
        if: steps.azure_creds.outputs.ok == 'true'
        run: |
          if [ ! -f "${{ matrix.dockerfile }}" ]; then
            echo "Skipping ${{ matrix.name }} because ${{ matrix.dockerfile }} is not present yet."
            exit 0
          fi
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.repository }}:${{ github.sha }}" \
            --tag "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.repository }}:latest" \
            "${{ matrix.context }}"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.repository }}:${{ github.sha }}"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.repository }}:latest"
