name: deploy-hackathon

on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: Environment name parameter override.
        required: true
        default: hackathon
        type: string
      location:
        description: Azure region for the resource group.
        required: true
        default: westus2
        type: string
      resourceGroupName:
        description: Target Azure resource group.
        required: true
        default: rg-hackathon
        type: string
      runSmoke:
        description: Run post-deploy smoke checks.
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy hackathon environment
    runs-on: ubuntu-latest
    environment: hackathon
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      SQL_ADMIN_LOGIN: ${{ vars.SQL_ADMIN_LOGIN }}
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
      AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
      AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
      AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep templates and hackathon parameters JSON
        shell: pwsh
        run: ./scripts/infra/validate-bicep.ps1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install EF Core CLI
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Ensure resource group exists (idempotent)
        shell: pwsh
        run: az group create --name "${{ inputs.resourceGroupName }}" --location "${{ inputs.location }}"

      - name: Resolve deployment image references
        id: images
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACR_LOGIN_SERVER}" ]; then
            echo "::error::Image resolution failed. Set repository/environment variable ACR_LOGIN_SERVER so deploy-hackathon can resolve :latest tags automatically."
            exit 1
          fi

          frontend_image="${ACR_LOGIN_SERVER}/frontend-spa:latest"
          market_image="${ACR_LOGIN_SERVER}/market-service:latest"
          trade_image="${ACR_LOGIN_SERVER}/trade-service:latest"
          settlement_image="${ACR_LOGIN_SERVER}/settlement-service:latest"

          echo "frontend_image=${frontend_image}" >> "$GITHUB_OUTPUT"
          echo "market_image=${market_image}" >> "$GITHUB_OUTPUT"
          echo "trade_image=${trade_image}" >> "$GITHUB_OUTPUT"
          echo "settlement_image=${settlement_image}" >> "$GITHUB_OUTPUT"

      - name: ARM what-if (preview changes)
        shell: pwsh
        run: >
          ./scripts/infra/deploy-hackathon.ps1
          -WhatIf
          -EnvironmentName "${{ inputs.environmentName }}"
          -Location "${{ inputs.location }}"
          -ResourceGroupName "${{ inputs.resourceGroupName }}"
          -FrontendImage "${{ steps.images.outputs.frontend_image }}"
          -MarketServiceImage "${{ steps.images.outputs.market_image }}"
          -TradeServiceImage "${{ steps.images.outputs.trade_image }}"
          -SettlementServiceImage "${{ steps.images.outputs.settlement_image }}"

      - name: Deploy infrastructure only
        shell: pwsh
        run: >
          ./scripts/infra/deploy-hackathon.ps1
          -EnvironmentName "${{ inputs.environmentName }}"
          -Location "${{ inputs.location }}"
          -ResourceGroupName "${{ inputs.resourceGroupName }}"
          -DeployApps:$false
          -FrontendImage "${{ steps.images.outputs.frontend_image }}"
          -MarketServiceImage "${{ steps.images.outputs.market_image }}"
          -TradeServiceImage "${{ steps.images.outputs.trade_image }}"
          -SettlementServiceImage "${{ steps.images.outputs.settlement_image }}"

      - name: Resolve SQL targets for EF migrations
        id: sql
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_NAME=$(jq -r '.parameters.projectName.value' infra/environments/hackathon/parameters.dev.json)
          ENV_NAME="${{ inputs.environmentName }}"
          RG="${{ inputs.resourceGroupName }}"
          SQL_FQDN=$(az sql server list --resource-group "$RG" --query "[?starts_with(name, 'sql-${PROJECT_NAME}-${ENV_NAME}-')].fullyQualifiedDomainName | [0]" -o tsv)
          if [ -z "$SQL_FQDN" ]; then
            echo "::error::Could not resolve SQL server FQDN in resource group '$RG'."
            exit 1
          fi

          echo "sql_fqdn=$SQL_FQDN" >> "$GITHUB_OUTPUT"
          echo "market_db=${PROJECT_NAME}-${ENV_NAME}-market" >> "$GITHUB_OUTPUT"
          echo "trade_db=${PROJECT_NAME}-${ENV_NAME}-trade" >> "$GITHUB_OUTPUT"
          echo "settlement_db=${PROJECT_NAME}-${ENV_NAME}-settlement" >> "$GITHUB_OUTPUT"

      - name: Apply EF Core migrations
        shell: bash
        env:
          SQL_FQDN: ${{ steps.sql.outputs.sql_fqdn }}
          MARKET_DB: ${{ steps.sql.outputs.market_db }}
          TRADE_DB: ${{ steps.sql.outputs.trade_db }}
          SETTLEMENT_DB: ${{ steps.sql.outputs.settlement_db }}
        run: |
          set -euo pipefail

          build_connection_string() {
            local db_name="$1"
            printf 'Server=tcp:%s,1433;Initial Catalog=%s;Persist Security Info=False;User ID=%s;Password=%s;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;' \
              "$SQL_FQDN" "$db_name" "$SQL_ADMIN_LOGIN" "$SQL_ADMIN_PASSWORD"
          }

          run_migration() {
            local service_name="$1"
            local db_name="$2"
            local project_path="$3"
            local startup_path="$4"
            echo "Applying EF migrations for ${service_name} -> ${db_name}..."
            ConnectionStrings__Sql="$(build_connection_string "$db_name")" \
              dotnet ef database update --project "$project_path" --startup-project "$startup_path"
          }

          run_migration "market-service" "$MARKET_DB" \
            "apps/services/market-service/src/MarketService.Infrastructure/MarketService.Infrastructure.csproj" \
            "apps/services/market-service/src/MarketService/MarketService.csproj"

          run_migration "trade-service" "$TRADE_DB" \
            "apps/services/trade-service/src/TradeService.Infrastructure/TradeService.Infrastructure.csproj" \
            "apps/services/trade-service/src/TradeService/TradeService.csproj"

          run_migration "settlement-service" "$SETTLEMENT_DB" \
            "apps/services/settlement-service/src/SettlementService.Infrastructure/SettlementService.Infrastructure.csproj" \
            "apps/services/settlement-service/src/SettlementService/SettlementService.csproj"

      - name: Deploy container apps
        shell: pwsh
        run: >
          ./scripts/infra/deploy-hackathon.ps1
          -EnvironmentName "${{ inputs.environmentName }}"
          -Location "${{ inputs.location }}"
          -ResourceGroupName "${{ inputs.resourceGroupName }}"
          -FrontendImage "${{ steps.images.outputs.frontend_image }}"
          -MarketServiceImage "${{ steps.images.outputs.market_image }}"
          -TradeServiceImage "${{ steps.images.outputs.trade_image }}"
          -SettlementServiceImage "${{ steps.images.outputs.settlement_image }}"

      - name: Resolve Container Apps FQDNs for smoke checks
        id: endpoints
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_NAME=$(jq -r '.parameters.projectName.value' infra/environments/hackathon/parameters.dev.json)
          ENV_NAME="${{ inputs.environmentName }}"
          RG="${{ inputs.resourceGroupName }}"

          FRONTEND_APP="fe-${PROJECT_NAME}-${ENV_NAME}"
          MARKET_APP="mkt-${PROJECT_NAME}-${ENV_NAME}"
          TRADE_APP="trd-${PROJECT_NAME}-${ENV_NAME}"
          SETTLEMENT_APP="stl-${PROJECT_NAME}-${ENV_NAME}"

          FRONTEND_URL="https://$(az containerapp show --resource-group "$RG" --name "$FRONTEND_APP" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          MARKET_API_URL="https://$(az containerapp show --resource-group "$RG" --name "$MARKET_APP" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          TRADE_API_URL="https://$(az containerapp show --resource-group "$RG" --name "$TRADE_APP" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          SETTLEMENT_API_URL="https://$(az containerapp show --resource-group "$RG" --name "$SETTLEMENT_APP" --query 'properties.configuration.ingress.fqdn' -o tsv)"

          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "market_api_url=$MARKET_API_URL" >> "$GITHUB_OUTPUT"
          echo "trade_api_url=$TRADE_API_URL" >> "$GITHUB_OUTPUT"
          echo "settlement_api_url=$SETTLEMENT_API_URL" >> "$GITHUB_OUTPUT"

      - name: Run HTTP smoke checks (frontend + API /health)
        if: ${{ inputs.runSmoke }}
        shell: pwsh
        env:
          FRONTEND_URL: ${{ steps.endpoints.outputs.frontend_url }}
          MARKET_API_URL: ${{ steps.endpoints.outputs.market_api_url }}
          TRADE_API_URL: ${{ steps.endpoints.outputs.trade_api_url }}
          SETTLEMENT_API_URL: ${{ steps.endpoints.outputs.settlement_api_url }}
        run: ./scripts/infra/smoke-hackathon.ps1
